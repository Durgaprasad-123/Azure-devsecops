apiVersion: apps/v1
kind: Deployment
metadata:
  name: juice-shop
  labels:
    app: juice-shop

spec:
  replicas: 1

  selector:
    matchLabels:
      app: juice-shop

  template:
    metadata:
      labels:
        app: juice-shop

    spec:
      containers:
        - name: juice-shop
          image: ${ACR_LOGIN_SERVER}/juice-shop:${IMAGE_TAG}
          imagePullPolicy: Always

          ports:
            - containerPort: 3000
              protocol: TCP

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
